appId: ${MAESTRO_APP_ID}
tags:
  - regression
  - auth
---
- runFlow:
    file: ../_helpers/launch_app.yaml
- assertVisible:
    id: "auth.screen"
- tapOn:
    id: "auth.link_forgot_password"
- assertVisible:
    id: "forgot_password.screen"
- tapOn:
    id: "forgot_password.email"
- inputText: ${E2E_USER_EMAIL}
- tapOn:
    id: "forgot_password.submit"
- assertVisible:
    id: "forgot_password.success"
