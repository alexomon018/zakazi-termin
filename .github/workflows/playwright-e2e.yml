name: Playwright E2E

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/playwright-e2e.yml"
      - "apps/web/**"
      - "packages/trpc/**"
      - "packages/prisma/**"
      - "packages/auth/**"
      - "packages/ui/**"
      - "packages/scheduling/**"
      - "packages/emails/**"
      - "packages/calendar/**"
      - "packages/config/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
        working-directory: apps/web

      - name: Create Neon Branch
        id: create-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: test-${{ github.ref_name }}-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent: main

      - name: Generate Prisma Client
        run: yarn db:generate
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}

      - name: Push Database Schema
        run: yarn workspace @salonko/prisma db:push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}

      - name: Run Playwright tests
        run: yarn test:e2e:ci
        env:
          CI: true
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_NAME: Zakazi Termin
          NEXT_PUBLIC_DEFAULT_TIMEZONE: Europe/Belgrade
          NEXT_PUBLIC_DEFAULT_LOCALE: sr
          EMAIL_FROM: noreply@zakazi-termin.rs
          PLAYWRIGHT_TEST_MODE: "true"

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/web/test-results/
          retention-days: 7

      - name: Delete Neon Branch
        if: always() && steps.create-branch.outcome == 'success'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: test-${{ github.ref_name }}-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
