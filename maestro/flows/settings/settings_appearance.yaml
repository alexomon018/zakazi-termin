appId: ${MAESTRO_APP_ID}
tags:
  - regression
  - settings
---
# Requires OAuth session. Više → tap "Izgled" menu → Izgled screen.
- runFlow:
    file: ../_helpers/launch_app.yaml
- runFlow:
    when:
      visible: "Više"
    commands:
      - tapOn: "Više"
      - tapOn: "Izgled"
      - assertVisible: "Izgled"
