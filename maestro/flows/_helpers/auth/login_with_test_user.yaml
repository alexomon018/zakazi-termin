appId: ${MAESTRO_APP_ID}
---
# Requires testIDs on the login form (align with apps/mobile).
- runFlow:
    file: ../launch_app.yaml
- assertVisible:
    id: "auth.screen"
- tapOn:
    id: "auth.email"
- inputText: ${E2E_USER_EMAIL}
- tapOn:
    id: "auth.password"
- inputText: ${E2E_USER_PASSWORD}
- tapOn:
    id: "auth.submit"
- assertVisible:
    id: "dashboard.root"
