appId: ${MAESTRO_APP_ID}
tags:
  - regression
  - auth
---
# Logout: Više → Odjavite se, or noop if already on login (OAuth; no password form).
# Handles both states: already logged out (login visible) or logged in (session restored).
- runFlow:
    file: ../_helpers/launch_app.yaml
# Logged in: open "Više" (settings) tab and sign out.
- runFlow:
    when:
      visible: "Više"
    commands:
      - tapOn: "Više"
      - tapOn: "Odjavite se"
      - extendedWaitUntil:
          visible: "Prijavite se"
          timeout: 30000
# Already on login (no session): nothing to log out — assert login CTA.
- runFlow:
    when:
      visible: "Prijavite se"
    commands:
      - assertVisible: "Prijavite se"
