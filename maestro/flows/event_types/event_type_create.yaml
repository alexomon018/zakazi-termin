- tapOn:
    id: "event_type_edit.title"
- inputText: "E2E Meeting"
- tapOn:
    id: "event_type_edit.duration"
- inputText: "30"
- tapOn:
    id: "event_type_edit.save"
- assertVisible:
    id: "event_types.screen"
